name: release

# tag push 触发：5 平台 matrix build，每个 target 打包 thesis-hook + thesis-mcp-server
# 上传到 GitHub release 供 plugin fetch-binaries.sh 拉取。
#
# tag 格式：v0.1.0 / v0.2.0 etc.（语义版本）

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
          - target: x86_64-apple-darwin
            # 2026-05-18: 从 macos-13 改 macos-14。macos-13 (Intel) runner 全球
            # 资源紧张（GitHub 已减配 Intel runner），单 job 排队 46+ 分钟未拿到
            # runner。macos-14 (Apple Silicon) 通过 rustup target add x86_64-apple-darwin
            # 在 Silicon 上 cross-compile 到 Intel 是 Rust 原生支持的标准操作，
            # 不需要 cross crate。产物仍是 x86_64 Intel Mac 可执行。
            runner: macos-14
            cross: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (linux arm64)
        if: matrix.cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build native
        if: ${{ !matrix.cross }}
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Build via cross
        if: matrix.cross
        run: cross build --release --workspace --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ARCHIVE="thesis-mcp-${VERSION}-${{ matrix.target }}.tar.gz"
          # 自 v0.1.3 起：tarball 含 install.sh + bin/ + skills/，用户解压即可装
          mkdir -p package/bin package/skills
          cp target/${{ matrix.target }}/release/thesis-hook package/bin/
          cp target/${{ matrix.target }}/release/thesis-mcp-server package/bin/
          chmod +x package/bin/thesis-hook package/bin/thesis-mcp-server
          cp scripts/install.sh package/
          chmod +x package/install.sh
          cp -r skills/thesis package/skills/
          cp README.md package/
          tar -czf "$ARCHIVE" -C package .
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" | awk '{print $1}' > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" | awk '{print $1}' > "$ARCHIVE.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ARCHIVE="thesis-mcp-${VERSION}-${{ matrix.target }}.zip"
          # 自 v0.1.3 起：tarball 含 install.sh + bin/ + skills/。Windows 用户需 git-bash / wsl 运行 install.sh
          mkdir -p package/bin package/skills
          cp target/${{ matrix.target }}/release/thesis-hook.exe package/bin/
          cp target/${{ matrix.target }}/release/thesis-mcp-server.exe package/bin/
          cp scripts/install.sh package/
          cp -r skills/thesis package/skills/
          cp README.md package/
          7z a "$ARCHIVE" ./package/* >/dev/null
          certutil -hashfile "$ARCHIVE" SHA256 | sed -n '2p' | tr -d ' \r' > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          fail_on_unmatched_files: true
